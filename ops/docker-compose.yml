# Local development stack for FilsPay.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: filspay_dev_password
      POSTGRES_DB: filspay
    ports:
      - "5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      WEBHOOK_SECRET_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=" # BUG FIXED: valid 32-byte base64 key
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      WEBHOOK_SECRET_ENCRYPTION_KEY: "Rmlsc1BheSBkZXYgc2VjcmV0IGtleSAzMiBieXRlcyE="
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      WEBHOOK_SECRET_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=" # BUG FIXED
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      WEBHOOK_SECRET_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=" # BUG FIXED
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: dev-token
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_TOKEN: dev-token
      PGCONN_SETTLEMENT: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filspay_pgdata: